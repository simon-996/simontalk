name: simontalk_client
description: "SimonTalk — 让英语走进日常对话。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Roboto-OFL.txt
    - path: assets/fonts/NotoSansSC.woff2
      platforms: [web]
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
