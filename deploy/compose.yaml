name: simontalk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simontalk
      POSTGRES_PASSWORD: simontalk
      POSTGRES_DB: simontalk
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - simontalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simontalk -d simontalk"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  simontalk_pgdata:
