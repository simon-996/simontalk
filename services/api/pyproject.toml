[project]
name = "simontalk-api"
version = "0.1.0"
description = "SimonTalk account and preferences API"
requires-python = ">=3.13"
dependencies = [
  "anyio>=4,<4.13",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
simontalk-admin = "simontalk_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/simontalk_api/main.py" = ["B008"]
"src/simontalk_api/routes.py" = ["B008"]
"src/simontalk_api/practice_routes.py" = ["B008"]
"src/simontalk_api/connection_routes.py" = ["B008"]
"src/simontalk_api/observation_routes.py" = ["B008"]
"src/simontalk_api/transcript_routes.py" = ["B008"]
"src/simontalk_api/playback_routes.py" = ["B008"]

"src/simontalk_api/completion_routes.py" = ["B008"]
"src/simontalk_api/review_routes.py" = ["B008"]

"src/simontalk_api/review_job_routes.py" = ["B008"]
