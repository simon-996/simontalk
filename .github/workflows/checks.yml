name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simontalk
          POSTGRES_PASSWORD: simontalk
          POSTGRES_DB: simontalk_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U simontalk -d simontalk_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SIMONTALK_DATABASE_URL: postgresql+psycopg://simontalk:simontalk@127.0.0.1:54329/simontalk_test
      SIMONTALK_TEST_DATABASE_URL: postgresql+psycopg://simontalk:simontalk@127.0.0.1:54329/simontalk_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.13'
      - run: uv sync --locked --all-extras
      - name: Prepare PostgreSQL service clients
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          uv run --locked --no-sync python ../../scripts/prepare_test_postgres_tools.py
          --container "$POSTGRES_CONTAINER" --output "$RUNNER_TEMP/simontalk-pg-tools"
      - run: uv run ruff check . ../../scripts/prepare_test_postgres_tools.py --config pyproject.toml
      - run: uv run ruff format --check . ../../scripts/prepare_test_postgres_tools.py --config pyproject.toml
      - name: Test API including real backup restores
        env:
          SIMONTALK_REQUIRE_REAL_BACKUP_TESTS: '1'
          SIMONTALK_BACKUP_TEST_PG_DUMP: ${{ runner.temp }}/simontalk-pg-tools/pg_dump
          SIMONTALK_BACKUP_TEST_PG_RESTORE: ${{ runner.temp }}/simontalk-pg-tools/pg_restore
        run: uv run --locked --no-sync pytest -q
      - run: uv run alembic check

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: flutter pub get --enforce-lockfile
      - run: node --test test/web/*_test.mjs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - run: uv run ../../scripts/check_web_fonts.py --web-build build/web
